name: Codestyle Checks
on:
  push:
    branches:
      - 'master'
  pull_request:

# A newer push to the same pull request or branch cancels the older run still queued or running
concurrency:
  group: core_codestyle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codestyle:
    uses: azerothcore/reusable-workflows/.github/workflows/codestyle_modules.yml@main
