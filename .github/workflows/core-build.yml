name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  realm-core:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
    with:
      core-ref: e3cdb38576c4e42a408d16ed6f2c60fce3d71685
      extra-modules: buildthehomelab/wow-mod-individual-progression@edf5730e92c701adf42633e755d1d7948ac2c64f
  standalone-core:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
    with:
      core-ref: e3cdb38576c4e42a408d16ed6f2c60fce3d71685
      only: cpp
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test/run.sh
